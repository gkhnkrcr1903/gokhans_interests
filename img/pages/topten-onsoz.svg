<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
<defs><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 0.45 0 0 0 0 0.35 0 0 0 0 0.2 0 0 0 0.08 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<radialGradient id="v" cx="50%" cy="50%" r="75%"><stop offset="70%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#6b4a1e" stop-opacity="0.28"/></radialGradient></defs>
<rect width="600" height="800" fill="#f3e7c9"/>
<rect x="0" y="0" width="600" height="92" fill="#5b5f66"/><text x="30" y="60" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#ffd200" letter-spacing="2">ÖNSÖZ</text><text x="570" y="60" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="end">(temsilî metin)</text><text x="50" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b2118">Sevgili okuyucu,</text><text x="50" y="194" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b2118"></text><text x="50" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b2118">Dünyanın en yüksek dağı hangisi? En hızlı hayvanı?</text><text x="50" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b2118">En kalabalık ülkesi, en uzun nehri, en yüksek binası?</text><text x="50" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b2118">Peki Türkiye'nin en büyük gölü, en uzun ırmağı?</text><text x="50" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b2118"></text><text x="50" y="364" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b2118">Bu kitabın her sayfasında bir soru ve o sorunun</text><text x="50" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b2118">ilk on cevabı var. İster baştan sona okuyun,</text><text x="50" y="432" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b2118">ister rastgele bir sayfa açın: Her sayfada sizi</text><text x="50" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b2118">şaşırtacak bir rakam bekliyor.</text><text x="50" y="500" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b2118"></text><text x="50" y="534" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b2118">Arkadaşlarınızla iddiaya girmeden önce</text><text x="50" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2b2118">bir göz atmayı unutmayın!</text><text x="550" y="632" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#2b2118" text-anchor="end">— Yayın Kurulu</text><rect x="50" y="672" width="500" height="110" fill="#fff8e1" stroke="#1d4f91" stroke-width="2"/><text x="70" y="704" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#1d4f91">BU KİTAPTA</text><text x="70" y="732" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2b2118">Evren &amp; Doğa · Canlılar · İnsan &amp; Ülkeler · Yapılar</text><text x="70" y="758" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2b2118">Sinema &amp; Kültür · Spor · Türkiye'nin İlk 10'u</text>
<text x="300" y="782" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2b2118" text-anchor="middle" opacity="0.7">— 3 —</text>
<rect width="600" height="800" fill="url(#v)"/><rect width="600" height="800" filter="url(#n)"/>
</svg>