<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800"><rect width="600" height="800" fill="#f1ead6"/><text x="300" y="34" font-family="'Times New Roman', Times, serif" font-size="11" fill="#1c1a17" text-anchor="middle" letter-spacing="1.5">HÜRRİYET TOP TEN ANSİKLOPEDİSİ</text><line x1="36" y1="42" x2="564" y2="42" stroke="#3a3631" stroke-width="1.2"/><rect x="246" y="62" width="108" height="24" fill="#2f7fc1" stroke="#1c1a17"/><text x="300" y="79" font-family="'Arial Narrow', Arial, Helvetica, sans-serif" font-weight="bold" font-size="13" fill="#fff" text-anchor="middle" letter-spacing="1">ÖNSÖZ</text><text x="300" y="120" font-family="'Arial Narrow', Arial, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#1c1a17" text-anchor="middle">(blog için yazılmış temsilî metin)</text><text x="60" y="160" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1c1a17">Sevgili okuyucu,</text><text x="60" y="188" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1c1a17"></text><text x="60" y="216" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1c1a17">Dünyanın en yüksek dağı hangisi? En hızlı hayvanı?</text><text x="60" y="244" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1c1a17">En kalabalık ülkesi, en uzun nehri, en yüksek binası?</text><text x="60" y="272" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1c1a17">Peki Türkiye'nin en büyük gölü, en uzun ırmağı?</text><text x="60" y="300" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1c1a17"></text><text x="60" y="328" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1c1a17">Bu kitabın her sayfasında bir soru ve o sorunun</text><text x="60" y="356" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1c1a17">ilk on cevabı var. İster baştan sona okuyun,</text><text x="60" y="384" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1c1a17">ister rastgele bir sayfa açın: Her sayfada sizi</text><text x="60" y="412" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1c1a17">şaşırtacak bir rakam bekliyor.</text><text x="60" y="440" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1c1a17"></text><text x="60" y="468" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1c1a17">Arkadaşlarınızla iddiaya girmeden önce</text><text x="60" y="496" font-family="'Times New Roman', Times, serif" font-size="17" fill="#1c1a17">bir göz atmayı unutmayın!</text><text x="540" y="544" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="17" fill="#1c1a17" text-anchor="end">Yayın Kurulu</text><line x1="36" y1="584" x2="564" y2="584" stroke="#3a3631"/><text x="300" y="610" font-family="'Arial Narrow', Arial, Helvetica, sans-serif" font-weight="bold" font-size="15" fill="#1c1a17" text-anchor="middle">BU KİTAPTA</text><text x="300" y="638" font-family="'Times New Roman', Times, serif" font-size="15" fill="#1c1a17" text-anchor="middle">Evren ve Doğa · Canlılar · İnsan ve Ülkeler</text><text x="300" y="660" font-family="'Times New Roman', Times, serif" font-size="15" fill="#1c1a17" text-anchor="middle">Yapılar · Sinema ve Kültür · Spor</text><text x="300" y="682" font-family="'Times New Roman', Times, serif" font-size="15" fill="#1c1a17" text-anchor="middle">Türkiye'nin İlk 10'u</text><rect x="282" y="762" width="36" height="18" fill="#1c1a17"/><text x="300" y="775" font-family="'Arial Narrow', Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#f1ead6" text-anchor="middle">3</text><rect width="600" height="800" fill="none" stroke="#c9bc98" stroke-width="6"/></svg>